<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101a20">
  <title>Chess — Ajedrez</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- chess.js 1.4.0 se importa desde una CDN en script.js; requiere Internet. -->
  <script type="module" src="js/script.js"></script>
</head>
<body>
  <main class="game-shell">
    <header class="page-header">
      <a class="brand" href="index.html" aria-label="Chess, inicio">
        <span class="brand-mark" aria-hidden="true">♞</span>
        <span>Chess</span>
      </a>
      <p class="header-caption">Una partida, a tu ritmo</p>
    </header>

    <section class="game-layout" aria-label="Partida de ajedrez">
      <div class="board-frame">
        <section id="chess-clocks" class="chess-clocks" aria-label="Relojes de la partida">
          <div id="white-clock" class="clock-card" aria-label="Reloj de las blancas">
            <div class="clock-player-info">
              <span class="clock-player">Blancas</span>
              <span id="white-clock-status" class="clock-status">Preparado</span>
            </div>
            <time id="white-clock-time" class="clock-time" datetime="PT0S">00:00</time>
          </div>
          <div id="black-clock" class="clock-card" aria-label="Reloj de las negras">
            <div class="clock-player-info">
              <span class="clock-player">Negras</span>
              <span id="black-clock-status" class="clock-status">Preparado</span>
            </div>
            <time id="black-clock-time" class="clock-time" datetime="PT0S">00:00</time>
          </div>
        </section>
        <div class="board-coordinate-layout" aria-label="Tablero y coordenadas">
          <div class="board-files board-files-top" aria-hidden="true"></div>
          <div class="board-ranks board-ranks-left" aria-hidden="true"></div>
          <div id="chessboard" class="chessboard" role="grid" aria-label="Tablero de ajedrez"></div>
          <div class="board-ranks board-ranks-right" aria-hidden="true"></div>
          <div class="board-files board-files-bottom" aria-hidden="true"></div>
        </div>
      </div>

      <aside class="game-panel" aria-label="Estado de la partida">
        <div class="panel-heading">
          <p class="eyebrow">PARTIDA LOCAL</p>
          <h1>Chess</h1>
        </div>
        <div class="turn-card" aria-live="polite">
          <span class="turn-indicator" aria-hidden="true"></span>
          <div>
            <p class="eyebrow">TURNO ACTUAL</p>
            <p id="turn-label" class="turn-label">Blancas</p>
          </div>
        </div>
        <div class="validation-mode-control">
          <label for="validation-level">Validación de posiciones</label>
          <select id="validation-level">
            <option value="basic">Básica</option>
            <option value="strict">Estricta (sin historial)</option>
          </select>
        </div>
        <button id="enter-design-button" class="reset-button" type="button">Modo diseño</button>
        <div class="position-file-buttons" role="group" aria-label="Guardar o cargar posiciones">
          <button id="save-position-button" class="reset-button" type="button">Guardar posición</button>
          <button id="load-position-button" class="reset-button" type="button">Cargar posición</button>
        </div>
        <input id="position-file-input" type="file" accept=".fen,text/plain" hidden>
        <section id="design-tools" class="design-tools" aria-label="Herramientas de diseño" hidden>
          <h2>Editar posición</h2>
          <label for="design-color">Color de las piezas</label>
          <select id="design-color">
            <option value="w">Blancas</option>
            <option value="b">Negras</option>
          </select>
          <span class="design-label">Selecciona una pieza</span>
          <div id="piece-palette" class="piece-palette" role="group" aria-label="Piezas para colocar"></div>
          <button id="erase-piece-button" class="reset-button" type="button" aria-pressed="false">Eliminar pieza</button>
          <div class="design-action-row">
            <button id="clear-board-button" class="reset-button" type="button">Vaciar</button>
            <button id="initial-position-button" class="reset-button" type="button">Posición inicial</button>
          </div>
          <label for="design-turn">Juegan</label>
          <select id="design-turn">
            <option value="w">Blancas</option>
            <option value="b">Negras</option>
          </select>
          <button id="validate-position-button" class="reset-button" type="button">Validar posición</button>
          <button id="start-designed-game-button" class="reset-button primary-button" type="button">Iniciar partida</button>
        </section>
        <section id="design-message" class="design-message" aria-live="polite" hidden>
          <button id="close-design-message" class="message-close" type="button" aria-label="Cerrar mensaje">×</button>
          <div id="design-message-content"></div>
          <button id="load-in-design-button" class="reset-button" type="button" hidden>Cargar en Modo Diseño</button>
        </section>
        <p class="panel-note">El tablero está listo para una nueva partida.</p>
        <div class="control-buttons" role="group" aria-label="Mostrar control de casillas">
          <button id="white-control-button" class="reset-button control-button" type="button" aria-pressed="false" aria-label="Mostrar control de las piezas blancas">
            <span aria-hidden="true">◉</span><span>Control blancas</span>
          </button>
          <button id="black-control-button" class="reset-button control-button" type="button" aria-pressed="false" aria-label="Mostrar control de las piezas negras">
            <span aria-hidden="true">◉</span><span>Control negras</span>
          </button>
        </div>
        <button id="rotate-board-button" class="reset-button" type="button" aria-label="Girar orientación del tablero" aria-pressed="false">
          <span aria-hidden="true">⟳</span> Girar tablero
        </button>
        <button id="reset-button" class="reset-button" type="button">
          <span aria-hidden="true">↻</span> Reiniciar partida
        </button>
        <p class="phase-note">Mueve las piezas con clic o arrastrándolas</p>
      </aside>
    </section>
    <footer class="page-footer">Chess <span aria-hidden="true">·</span> Juego de estrategia</footer>
  </main>
</body>
</html>
